name: Build game

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"
  ORBBEC_SDK_TAG: "v2.9.3"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      - name: Stamp the version
        shell: bash
        run: tools/ci_set_version.sh

      - name: Download Orbbec SDK
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/orbbec/OrbbecSDK_v2/releases/tags/$env:ORBBEC_SDK_TAG"
          $asset = $release.assets | Where-Object { $_.name -like "OrbbecSDK_v2*win_x64.zip" } | Select-Object -First 1
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile orbbec_sdk.zip
          Expand-Archive orbbec_sdk.zip -DestinationPath orbbec_sdk_unpacked
          $inner = Get-ChildItem orbbec_sdk_unpacked | Select-Object -First 1
          if ($inner.PSIsContainer -and (Test-Path (Join-Path $inner.FullName "include"))) { $root = $inner.FullName } else { $root = (Resolve-Path orbbec_sdk_unpacked).Path }
          "ORBBEC_SDK_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SDK root: $root"

      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            extension/godot-cpp/bin
            extension/godot-cpp/gen
            extension/godot-cpp/src/**/*.obj
            extension/godot-cpp/gen/**/*.obj
          key: godot-cpp-${{ runner.os }}-${{ hashFiles('extension/godot-cpp/gdextension/extension_api.json') }}-msvc-v1

      - name: Download ONNX Runtime and the RTMPose model
        shell: pwsh
        run: |
          $v = "1.20.1"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip" -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath ort_unpacked
          $inner = Get-ChildItem ort_unpacked | Select-Object -First 1
          "ONNXRUNTIME_DIR=$($inner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Invoke-WebRequest "https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-t_simcc-body7_pt-body7_420e-256x192-026a1439_20230504.zip" -OutFile rtm.zip
          Expand-Archive rtm.zip -DestinationPath rtm_unpacked
          $onnx = Get-ChildItem rtm_unpacked -Recurse -Filter *.onnx | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path game\models | Out-Null
          Copy-Item $onnx.FullName game\models\rtmpose-t.onnx
          Get-Item game\models\rtmpose-t.onnx | Select-Object Length

      - name: Build extension (release)
        working-directory: extension
        run: scons platform=windows target=template_release orbbec_sdk="$env:ORBBEC_SDK_DIR" onnxruntime="$env:ONNXRUNTIME_DIR" -j4

      - name: Build extension (debug, for the editor)
        working-directory: extension
        run: scons platform=windows target=template_debug orbbec_sdk="$env:ORBBEC_SDK_DIR" onnxruntime="$env:ONNXRUNTIME_DIR" -j4

      - name: Download Godot and export templates
        shell: pwsh
        run: |
          $v = $env:GODOT_VERSION
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz -DestinationPath templates
          $dest = "$env:APPDATA\Godot\export_templates\$v.stable"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item templates\templates\* $dest -Recurse -Force

      # Godot sets the exe's icon and version info through rcedit, found via the editor settings.
      - name: Set up rcedit
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit-x64.exe
          $rcedit = (Resolve-Path rcedit-x64.exe).Path.Replace('\', '/')
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Godot" | Out-Null
          $lines = @('[gd_resource type="EditorSettings" format=3]', '', '[resource]', "export/windows/rcedit = `"$rcedit`"")
          Set-Content -Path "$env:APPDATA\Godot\editor_settings-4.4.tres" -Value $lines
          Get-Content "$env:APPDATA\Godot\editor_settings-4.4.tres"

      - name: Export Windows build
        shell: pwsh
        run: |
          $godot = (Get-ChildItem godot -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $godot --headless --path game --import
          & $godot --headless --path game --export-release "Windows Desktop" "$PWD\dist\WizardWars.exe"
          if (-not (Test-Path dist\WizardWars.exe)) { throw "export failed" }

      - name: Stage the runtime, the guide and the licences next to the exe
        shell: pwsh
        run: |
          Copy-Item "$env:ORBBEC_SDK_DIR\bin\OrbbecSDK.dll" dist -Force
          Copy-Item "$env:ONNXRUNTIME_DIR\lib\onnxruntime.dll" dist -Force
          Copy-Item "$env:ONNXRUNTIME_DIR\lib\onnxruntime_providers_shared.dll" dist -Force
          Copy-Item "$env:ORBBEC_SDK_DIR\bin\extensions" dist\extensions -Recurse -Force
          Copy-Item docs\PLAYING.md dist\HOW_TO_PLAY.md -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist -Force
          New-Item -ItemType Directory -Force -Path dist\licenses\orbbec, dist\licenses\onnxruntime | Out-Null
          Copy-Item licenses\* dist\licenses -Force
          Copy-Item "$env:ORBBEC_SDK_DIR\LICENSE.txt" dist\licenses\orbbec -Force
          if (Test-Path "$env:ORBBEC_SDK_DIR\licenses") { Copy-Item "$env:ORBBEC_SDK_DIR\licenses\*" dist\licenses\orbbec -Recurse -Force }
          Copy-Item "$env:ONNXRUNTIME_DIR\LICENSE", "$env:ONNXRUNTIME_DIR\ThirdPartyNotices.txt" dist\licenses\onnxruntime -Force
          Get-ChildItem dist -Recurse | Select-Object FullName, Length

      - name: Smoke test the exported exe
        shell: pwsh
        run: |
          $log = & dist\WizardWars.console.exe --headless --quit-after 60 2>&1 | Out-String
          Write-Host $log
          if ($log -notmatch "OrbbecCamera extension") { throw "extension did not load in the exported build" }

      # Smart App Control refuses any unsigned exe, and Godot's export templates are
      # unsigned. The editor binary is signed and runs a .pck named after it, so the
      # same game is also packaged that way: WizardWars.exe here is that binary, renamed.
      - name: Build the signed-runner package
        shell: pwsh
        run: |
          $godot = (Get-ChildItem godot -Filter "Godot_v*_win64_console.exe" | Select-Object -First 1).FullName
          $signed = (Get-ChildItem godot -Filter "Godot_v*_win64.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path dist-signed | Out-Null
          & $godot --headless --path game --export-pack "Windows Desktop" "$PWD\dist-signed\WizardWars.pck"
          if (-not (Test-Path dist-signed\WizardWars.pck)) { throw "pack export failed" }
          Copy-Item $signed dist-signed\WizardWars.exe
          Copy-Item dist\*.dll, dist\*.md dist-signed -Force
          Copy-Item dist\extensions dist-signed\extensions -Recurse -Force
          Copy-Item dist\licenses dist-signed\licenses -Recurse -Force
          $signature = Get-AuthenticodeSignature dist-signed\WizardWars.exe
          Write-Host "runner signature: $($signature.Status) - $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne "Valid") { throw "the Godot binary is not validly signed, so this package would not help anyone" }
          Get-ChildItem dist-signed | Select-Object Name, Length

      - name: Smoke test the signed-runner package
        shell: pwsh
        run: |
          $log = "$env:APPDATA\Godot\app_userdata\Wizard Wars\logs\godot.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $run = Start-Process -FilePath dist-signed\WizardWars.exe -ArgumentList "--headless", "--quit-after", "60", "--", "--no-save" -PassThru -Wait
          Write-Host "exit code $($run.ExitCode)"
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "OrbbecCamera extension loaded" -Quiet)) { throw "extension did not load in the signed-runner package" }

      - uses: actions/upload-artifact@v4
        with:
          name: WizardWars-windows-x64
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: WizardWars-windows-x64-signed-runner
          path: dist-signed

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: pip install scons

      - name: Stamp the version
        run: tools/ci_set_version.sh

      - name: Download Orbbec SDK
        run: |
          url=$(curl -sSL "https://api.github.com/repos/orbbec/OrbbecSDK_v2/releases/tags/$ORBBEC_SDK_TAG" \
            | python3 -c "import json,sys,fnmatch; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if fnmatch.fnmatch(a['name'], 'OrbbecSDK_v2*linux_x86_64.tar.gz')))")
          echo "Using $url"
          curl -sSL -o orbbec_sdk.tar.gz "$url"
          mkdir -p orbbec_sdk && tar xzf orbbec_sdk.tar.gz --strip-components=1 -C orbbec_sdk
          test -f orbbec_sdk/include/libobsensor/ObSensor.hpp
          echo "ORBBEC_SDK_DIR=$GITHUB_WORKSPACE/orbbec_sdk" >> "$GITHUB_ENV"

      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            extension/godot-cpp/bin
            extension/godot-cpp/gen
            extension/godot-cpp/src/**/*.o
            extension/godot-cpp/gen/**/*.o
          key: godot-cpp-${{ runner.os }}-${{ hashFiles('extension/godot-cpp/gdextension/extension_api.json') }}-gcc-v1

      - name: Download ONNX Runtime and the RTMPose model
        run: |
          tools/fetch_onnxruntime.sh linux-x64
          tools/fetch_rtmpose_model.sh
          echo "ONNXRUNTIME_DIR=$GITHUB_WORKSPACE/third_party/onnxruntime-linux-x64" >> "$GITHUB_ENV"

      - name: Build extension (release and debug)
        working-directory: extension
        run: |
          scons platform=linux target=template_release orbbec_sdk="$ORBBEC_SDK_DIR" onnxruntime="$ONNXRUNTIME_DIR" -j4
          scons platform=linux target=template_debug orbbec_sdk="$ORBBEC_SDK_DIR" onnxruntime="$ONNXRUNTIME_DIR" -j4
          ls -l ../game/bin/linux

      - name: Download Godot and export templates
        run: |
          v="$GODOT_VERSION"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot && chmod +x godot/Godot_v$v-stable_linux.x86_64
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/$v-stable/Godot_v$v-stable_export_templates.tpz"
          mkdir -p templates && unzip -q templates.tpz -d templates
          dest="$HOME/.local/share/godot/export_templates/$v.stable"
          mkdir -p "$dest" && cp -r templates/templates/* "$dest"/
          echo "GODOT=$PWD/godot/Godot_v$v-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export Linux build
        run: |
          mkdir -p dist
          "$GODOT" --headless --path game --import
          "$GODOT" --headless --path game --export-release "Linux" "$PWD/dist/WizardWars.x86_64"
          test -f dist/WizardWars.x86_64

      - name: Stage the runtime, the guide and the licences next to the binary
        run: |
          cp orbbec_sdk/lib/libOrbbecSDK.so* dist/
          cp "$ONNXRUNTIME_DIR"/lib/libonnxruntime.so* dist/
          cp -r orbbec_sdk/lib/extensions dist/extensions
          cp docs/PLAYING.md dist/HOW_TO_PLAY.md
          cp THIRD_PARTY_NOTICES.md dist/
          mkdir -p dist/licenses/orbbec dist/licenses/onnxruntime
          cp licenses/* dist/licenses/
          cp orbbec_sdk/LICENSE.txt dist/licenses/orbbec/
          if [ -d orbbec_sdk/licenses ]; then cp -r orbbec_sdk/licenses/* dist/licenses/orbbec/; fi
          cp "$ONNXRUNTIME_DIR"/LICENSE "$ONNXRUNTIME_DIR"/ThirdPartyNotices.txt dist/licenses/onnxruntime/
          cp orbbec_sdk/shared/99-obsensor-libusb.rules dist/ 2>/dev/null || true
          ls -l dist

      - name: Smoke test the exported binary
        run: |
          chmod +x dist/WizardWars.x86_64
          log=$(dist/WizardWars.x86_64 --headless --quit-after 60 2>&1 || true)
          echo "$log"
          echo "$log" | grep -q "OrbbecCamera extension loaded"

      - uses: actions/upload-artifact@v4
        with:
          name: WizardWars-linux-x64
          path: dist

  # A `v*` tag turns the three packages into a draft release: nothing is public
  # until somebody reads it over on GitHub and presses Publish.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          v="$GITHUB_REF_NAME"
          cd artifacts
          (cd WizardWars-windows-x64 && zip -qr "../WizardWars-$v-windows-x64.zip" .)
          (cd WizardWars-windows-x64-signed-runner && zip -qr "../WizardWars-$v-windows-x64-signed-runner.zip" .)
          chmod +x WizardWars-linux-x64/WizardWars.x86_64   # artifacts drop the executable bit
          tar -czf "WizardWars-$v-linux-x64.tar.gz" -C WizardWars-linux-x64 .
          sha256sum WizardWars-*.zip WizardWars-*.tar.gz > SHA256SUMS.txt
          ls -l

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Wizard Wars $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES_HEADER.md --generate-notes \
            artifacts/WizardWars-*.zip artifacts/WizardWars-*.tar.gz artifacts/SHA256SUMS.txt
